<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/login.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <H1>WELCOME TO MY TODO APP!!!!</H1>
    <form class="box-register">
        <image id="logoApp" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTJ0-W73GkahMPszJpvQfvLs2UhKHmfLflvP0QrpA9UaQ-YdtrBFjZxai0G&s=10"></image>
        <h3>ENTER YOUR ACCOUNT</h3>
        <div class="input-box">
            <i class="fa-solid fa-user">👤</i>
            <input id="input-name" type="text" placeholder="Username">
        </div>
        
        <div class="input-box">
            <i class="fa-solid fa-lock">🔒</i>
            <input id="input-pass" type="password" placeholder="Password">
            <span id="eye-pass">👁️</span>
        </div>
        <small id="error"></small>
        <button id="btnSubmit" type="submit">Submit</button>
        <a href="/html/register.html">You don't have an account yet.?</a>
    </form>
    <script src="/js/api.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
