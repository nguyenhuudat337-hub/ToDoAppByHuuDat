<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomePage</title>
</head>
<body>
    <h1>MY TODO APP</h1>
    <div class ="form">
        <input type="text" id = "input" placeholder=" Enter your task">
        <button id="add-task">
            <img src="https://cdn-icons-png.flaticon.com/512/992/992651.png" width="20px" height="20px" alt="Add Task Icon">
        </button>
    </div>
    <div class= "filter">
        <button class="buttonFilter active" data-button ="All">All</button>
        <button class ="buttonFilter" data-button ="Active">Active</button>
        <button class ="buttonFilter" data-button ="Completed">Completed</button>
    </div>
    <div class="todo-list">
    </div>
    <div class="Footer">
        <div class="Statistics">
            <p>Total Tasks:<span class="total-tasks">0</span></p>
            <p>Completed Tasks: <span class="completed-tasks">0</span></p>
            <p>Active Tasks: <span class="active-tasks">0</span></p>
        </div>
        <div class="Clear">
            <button id="clear-completed">Clear Completed</button>
            <button id="btn-Logout">
                Log Out 
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSR7-VBUNwGPmI39yq0AcNnQd-6QWeyASdnJ3NFt_pAdg&s=10" width="20px" height="20px">
            </button>
        </div>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
